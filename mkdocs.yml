site_name: keydex
site_description: Typed, explainable configuration access for Python, with the engine in Rust.
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Python guide: python.md
  - Rust guide: rust.md
  - API reference: api.md
  - Specification: spec.md
  - Benchmarks: benchmarks.md
  - Release: release.md
  - Decisions:
      - 0001 Name: adr/0001-name-keydex.md
      - 0002 No expressions: adr/0002-no-expressions.md
      - 0003 Wheels: adr/0003-wheels-abi3-and-314t.md
      - 0004 IR versioning: adr/0004-schema-ir-versioning.md
      - 0005 Mandatory spans: adr/0005-mandatory-spans.md
      - 0006 Parser selection: adr/0006-parsers-with-spans.md
      - 0007 IR over serde: adr/0007-schema-ir-over-serde.md
  - Spikes:
      - Parser spans: spikes/0001-parsers-spans.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
