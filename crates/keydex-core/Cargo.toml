[package]
name = "keydex-core"
description = "Motor de configuración de keydex: fuentes, precedencia, interpolación y procedencia."
readme = "README.md"
keywords = ["configuration", "config", "settings", "environment"]
categories = ["config"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["yaml", "toml", "json"]
yaml = ["dep:saphyr"]
toml = ["dep:toml_edit"]
json = ["dep:jsonc-parser"]

[dependencies]
thiserror.workspace = true
saphyr = { version = "0.3.3", optional = true }
toml_edit = { version = "0.25.17", optional = true }
jsonc-parser = { version = "0.34.0", optional = true }
