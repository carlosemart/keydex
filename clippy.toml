# Hard rule 2 of AGENTS.md: keydex-core does not read the environment, the clock or the
# filesystem. Enforced with `deny(clippy::disallowed_methods)` in
# crates/keydex-core/src/lib.rs.
disallowed-methods = [
  { path = "std::env::var", reason = "the core does not read the environment: inject EnvSource" },
  { path = "std::env::var_os", reason = "the core does not read the environment: inject EnvSource" },
  { path = "std::env::vars", reason = "the core does not read the environment: inject EnvSource" },
  { path = "std::env::vars_os", reason = "the core does not read the environment: inject EnvSource" },
  { path = "std::time::SystemTime::now", reason = "the core does not read the clock: inject Clock" },
  { path = "std::fs::read", reason = "the core does not read the filesystem: inject FileProvider" },
  { path = "std::fs::read_to_string", reason = "the core does not read the filesystem: inject FileProvider" },
]
