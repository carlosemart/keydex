[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
# No fallar por licencias permitidas que hoy no aparecen en el árbol.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
deny = [
  { name = "serde_yaml", reason = "archivado y no conserva spans; usa saphyr/marked_yaml" },
  { name = "serde_yml", reason = "fork abandonado de serde_yaml" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
