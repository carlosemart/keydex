name: homelab
env: dev

db:
  host: localhost
  port: 5432
  name: homelab
  user: keydex
  password: change-me
  pool_size: 5
  # Defined once: interpolation runs AFTER the merge, so in prod it points at
  # db.internal without repeating the line.
  dsn: "postgres://${db.user}@${db.host}:${db.port}/${db.name}"

api:
  base_url: https://api.homelab.local
  timeout_s: 10
  retries: 2

features:
  metrics: false
  tracing: false

backup:
  dir: ./backups
  keep_days: 7
